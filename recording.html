<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Записатися на прийом - Ветеринарна клініка "Друзі тварин"</title>
    <meta name="description" content="Запишіться на прийом до ветеринарної клініки Друзі Тварин онлайн. Оберіть зручний час для огляду чи консультації вашого улюбленця.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <div class="logo">
            <img src="logo.png.png" alt="Логотип">
            <a href="index.html">Друзі Тварин</a>
        </div>
        <nav class="navigation">
            <ul>
                <li><a href="#">Місто</a></li>
                <li><a href="#">Особистий кабінет</a></li>
                <li><a href="about.html">Про нас</a></li>
                <li><a href="#">Новини</a></li>
                <li><a href="contacts.html">Контакти</a></li>
                <li><a href="#">Блог</a></li>
            </ul>
        </nav>
        <div class="konotop">
            <img src="location.jpg" alt="Локація">
            <a href="#">МІСТО</a>
        </div>
    </header>

<main class="recording-container">
    <section class="order-section">

        <div class="order-container">

            <h1>Оформлення замовлення</h1>

            <a href="index.html" class="back-link">
                &lt; НАЗАД
            </a>

            <form action="#" method="POST">

                <div class="form-group">
                    <label for="name">ПІП</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Ваше ім'я"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Номер телефону</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+38 (097) 999 99 99"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="date">Бажана дата та час</label>
                    <input
                        type="datetime-local"
                        id="date"
                        name="date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="problem">Опис проблеми</label>
                    <textarea
                        id="problem"
                        name="problem"
                        placeholder="Коротко опишіть проблему"
                    ></textarea>
                </div>

                <button type="submit">Записатись</button>

            </form>

        </div>

    </section>
</main>   
    <footer>
        <ul class="socials-list">
            <li><a href="#"><img src="instagram-icon.jpe" alt="Instagram"></a></li>
            <li><a href="#"><img src="telegram-icon.png.jpe" alt="Telegram"></a></li>
            <li><a href="#"><img src="youtube-icon.png.jpe" alt="YouTube"></a></li>
            <li><a href="#"><img src="facebook-icon.png.jpe" alt="Facebook"></a></li>
        </ul>
    </footer>
<script src="script/script.js"></script>
</body>
</html>
